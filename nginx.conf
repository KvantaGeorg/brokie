server {
    listen 80;
    server_name www.yourbrand.com;
    return 301 https://yourbrand.com$request_uri;
}

server {
    listen 80 default_server;
    server_name yourbrand.com localhost _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/xml application/javascript application/json image/svg+xml;

    # Generated files with a content hash in the name (JS, CSS, images).
    # HTML points at these URLs, so a new deploy gets a new URL and browsers fetch it.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets under root (favicons, manifest, etc.)
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|xml|webmanifest)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML shells & SPA client-side routes
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
